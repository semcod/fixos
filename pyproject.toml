[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fixos"
version = "2.2.49"
description = "AI-powered Linux/Windows diagnostics and repair – audio, hardware, system issues"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "fixos contributors" },
    { name = "Tom Sapletta", email = "tom@sapletta.com" },
]
keywords = ["linux", "windows", "diagnostics", "ai", "llm", "audio", "system-repair", "cross-platform"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Systems Administration",
    "Topic :: System :: Monitoring",
    "Environment :: Console",
]
dependencies = [
    "openai>=1.35.0",
    "prompt_toolkit>=3.0.43",
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0",
]

license = "Apache-2.0"
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "pytest-sugar>=0.9.7",
    "goal>=2.1.0; python_version >= '3.12'",
    "costs>=0.1.20",
]

[project.scripts]
fixos = "fixos.cli:main"

[project.urls]
Homepage = "https://github.com/wronai/fixos"
"Bug Tracker" = "https://github.com/wronai/fixos/issues"

[tool.setuptools.packages.find]
exclude = ["tests*", "docker*"]

[tool.setuptools.package-data]
fixos = [
    "features/data/*.yaml",
    "features/data/profiles/*.yaml",
    "profiles/*.yaml",
]

[tool.wellmanifest]
standard = "0.20.32"
revision = "b6ba9c21a65a6a5648ecf904b64c3b75295e136f"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short -p wellmanifest_governance"

[tool.ruff.lint]
# Keep the established baseline stable when newer Ruff releases add rules.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These managed validators intentionally use import-time and validation side
# effects; keep the target lint gate precise without editing standard files.
".governance/remediation_intent.py" = ["F841"]
".governance/change_lease_check.py" = ["E701", "E702"]
".governance/ticket_storage.py" = ["E402"]
".governance/work_start_check.py" = ["E402"]

[tool.coverage.run]
source = ["fixos"]
omit = ["tests/*", "docker/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }
