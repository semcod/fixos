# SCENARIO: CLI Command Tests
# TYPE: cli
# GENERATED: true

CONFIG[2]{key, value}:
  cli_command, python -m fixos
  timeout_ms, 10000

# Test 1: CLI help command
SHELL "python -m fixos --help" 5000
ASSERT_EXIT_CODE 0
ASSERT_STDOUT_CONTAINS "Usage:"

# Test 2: CLI version command
SHELL "python -m fixos --version" 5000
ASSERT_EXIT_CODE 0
ASSERT_STDOUT_CONTAINS "fixos v"

# Test 3: fast heuristic workflow is executable without an LLM
SHELL "python -m fixos quick --json --no-save" 10000
ASSERT_EXIT_CODE 0
ASSERT_STDOUT_CONTAINS "heuristic-local"

# Test 4: cleanup exposes the corrected individual-service workflow
SHELL "python -m fixos cleanup --help" 5000
ASSERT_EXIT_CODE 0
ASSERT_STDOUT_CONTAINS "Wyczyść konkretną usługę"
