name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  preflight:
    name: Preflight / Python 3.12
    runs-on: ubuntu-latest
    outputs:
      failure_class: ${{ steps.summary.outputs.failure_class }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        id: setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: dependencies
        shell: bash
        run: |
          if ! python -m pip install --upgrade pip; then
            echo "failure_class=DEPENDENCY" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! python -m pip install -r requirements-dev.txt; then
            echo "failure_class=DEPENDENCY" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! python -m pip install -e .; then
            echo "failure_class=DEPENDENCY" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Compile source and tests
        id: compile
        shell: bash
        run: |
          if ! python -m compileall -q fixos tests; then
            echo "failure_class=LINT" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Collect tests
        id: collect
        shell: bash
        run: |
          if ! python -m pytest --collect-only -q; then
            echo "failure_class=TEST" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Write preflight summary
        id: summary
        if: always()
        shell: bash
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          SETUP_RESULT: ${{ steps.setup.outcome }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          COMPILE_RESULT: ${{ steps.compile.outcome }}
          COLLECT_RESULT: ${{ steps.collect.outcome }}
        run: |
          failure_class=NONE
          next_step="No action required."
          if [[ "$CHECKOUT_RESULT" != "success" ]]; then
            failure_class=CHECKOUT
            next_step="Inspect repository checkout and ref availability."
          elif [[ "$SETUP_RESULT" != "success" ]]; then
            failure_class=INFRASTRUCTURE
            next_step="Inspect the runner and the requested Python toolchain."
          elif [[ "$DEPENDENCIES_RESULT" != "success" ]]; then
            failure_class=DEPENDENCY
            next_step="Inspect package constraints and dependency installation logs."
          elif [[ "$COMPILE_RESULT" != "success" ]]; then
            failure_class=LINT
            next_step="Run compileall or the changed-file lint locally."
          elif [[ "$COLLECT_RESULT" != "success" ]]; then
            failure_class=TEST
            next_step="Run pytest collection locally and inspect import/test discovery errors."
          fi

          {
            echo "## CI preflight"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Checkout | $CHECKOUT_RESULT |"
            echo "| Python setup | $SETUP_RESULT |"
            echo "| Dependencies | $DEPENDENCIES_RESULT |"
            echo "| Compilation | $COMPILE_RESULT |"
            echo "| Test collection | $COLLECT_RESULT |"
            echo ""
            echo "**Failure class:** `$failure_class`"
            echo "**Next step:** $next_step"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "failure_class=$failure_class" >> "$GITHUB_OUTPUT"

      - name: Enforce preflight
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.summary.outputs.failure_class }}" != "NONE" ]]; then
            exit 1
          fi

  test:
    name: Test / Python ${{ matrix.python-version }}
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

  lint:
    name: Lint / changed Python files
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Lint changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            mapfile -d '' changed_python < <(git ls-files -z -- '*.py')
          else
            mapfile -d '' changed_python < <(git diff --name-only -z "$BASE_SHA"...HEAD -- '*.py')
          fi
          if ((${#changed_python[@]} == 0)); then
            echo "No Python files changed; lint is not applicable."
            exit 0
          fi
          python -m ruff check "${changed_python[@]}"

  summary:
    name: Summary / failure taxonomy
    if: always()
    needs: [preflight, test, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Publish actionable summary
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          PREFLIGHT_CLASS: ${{ needs.preflight.outputs.failure_class }}
          TEST_RESULT: ${{ needs.test.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        shell: bash
        run: |
          failure_class=NONE
          next_step="No action required."
          if [[ "$PREFLIGHT_RESULT" != "success" ]]; then
            failure_class="${PREFLIGHT_CLASS:-INFRASTRUCTURE}"
            next_step="Resolve the preflight failure before rerunning the full matrix."
          elif [[ "$TEST_RESULT" != "success" ]]; then
            failure_class=TEST
            next_step="Run the failing Python matrix test locally with --tb=short."
          elif [[ "$LINT_RESULT" != "success" ]]; then
            failure_class=LINT
            next_step="Run Ruff against the changed Python files locally."
          fi

          {
            echo "## CI result"
            echo ""
            echo "| Stage | Result |"
            echo "| --- | --- |"
            echo "| Preflight | $PREFLIGHT_RESULT |"
            echo "| Python test matrix | $TEST_RESULT |"
            echo "| Changed-file lint | $LINT_RESULT |"
            echo ""
            echo "**Failure class:** `$failure_class`"
            echo "**Next step:** $next_step"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failure_class" != "NONE" ]]; then
            exit 1
          fi
